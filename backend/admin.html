
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản trị sản phẩm · DK FASHION</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{font-family:Arial;background:#f4f4f4;color:#111}
    .brand{font-weight:900}
    .card,.form-control,.form-select,.btn{border-radius:0}
    .card{border:0;box-shadow:0 2px 16px #0000000c}
    .preview{width:72px;height:72px;object-fit:cover;background:#eee}
    .thumb{width:52px;height:52px;object-fit:cover;background:#eee}
  </style>
</head>
<body>
<header class="bg-white border-bottom py-3">
  <div class="container d-flex justify-content-between">
    <b class="brand">DK FASHION / QUẢN TRỊ</b>
    <a href="https://fashionstore.id.vn" class="text-dark">Xem cửa hàng ↗</a>
  </div>
</header>

<main class="container py-4">
  <div id="notice" class="alert d-none" role="status"></div>

  <section id="login" class="card p-4 mx-auto" style="max-width:460px">
    <h1 class="h4 fw-bold">Đăng nhập quản trị</h1>
    <form id="loginForm">
      <label class="form-label" for="username">Tên đăng nhập</label>
      <input id="username" class="form-control mb-3" type="text" autocomplete="username" value="admin" required>
      <label class="form-label" for="pw">Mật khẩu quản trị</label>
      <input id="pw" class="form-control mb-3" type="password" autocomplete="current-password" required>
      <button class="btn btn-dark w-100">ĐĂNG NHẬP</button>
    </form>
  </section>

  <section id="panel" class="d-none">
    <div class="d-flex justify-content-between mb-3">
      <h1 class="h3 fw-bold">Quản lý sản phẩm</h1>
      <button id="logout" class="btn btn-outline-dark">Đăng xuất</button>
    </div>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card p-4">
          <h2 id="formTitle" class="h5">Thêm sản phẩm</h2>

          <form id="form">
            <input id="id" type="hidden">

            <label class="form-label" for="name">Tên sản phẩm *</label>
            <input id="name" class="form-control mb-3" required maxlength="180">

            <label class="form-label" for="productMainCategory">Danh mục chính *</label>
            <select id="productMainCategory" class="form-select mb-3" required>
              <option value="Nam">NAM</option>
              <option value="N&#7919;">N&#7918;</option>
              <option value="Tr&#7867; em">TR&#7866; EM</option>
              <option value="sports">TH&#7874; THAO</option>
            </select>

            <div class="row">
              <div class="col-6">
                <label class="form-label" for="price">Giá VNĐ *</label>
                <input id="price" class="form-control" type="number" min="0" required>
              </div>
              <div class="col-6">
                <label class="form-label" for="category">Danh m&#7909;c con *</label>
                <select id="category" class="form-select" required>
                  <option value="" disabled selected>Ch&#7885;n danh m&#7909;c</option>
                  <option value="all" disabled>T&#7845;t c&#7843; (ch&#7881; d&#249;ng khi l&#7885;c)</option>
                  <option value="Gi&#224;y">Gi&#224;y</option>
                  <option value="D&#233;p">D&#233;p</option>
                  <option value="Qu&#7847;n">Qu&#7847;n</option>
                  <option value="&#193;o">&#193;o</option>
                  <option value="Ph&#7909; ki&#7879;n">Ph&#7909; ki&#7879;n</option>
                </select>
              </div>
            </div>
            <div id="legacyCategoryNotice" class="form-text text-warning mb-3" role="status" hidden></div>

            <label class="form-label" for="sizes">Kích cỡ và số lượng *</label>
            <textarea id="sizes" class="form-control mb-1" rows="3"
              placeholder="36:2, 37:4, 38:5" required></textarea>
            <div class="form-text mb-3">
              Nhập dạng kích cỡ:số lượng, phân cách bằng dấu phẩy.
            </div>

            <label class="form-label" for="file">
              Ảnh sản phẩm * (JPEG/PNG/WEBP, tối đa 450 KB)
            </label>
            <input id="file" class="form-control mb-2" type="file"
              accept="image/jpeg,image/png,image/webp">

            <div class="d-flex align-items-center gap-3 mb-3">
              <img id="preview" class="preview" alt="Xem trước ảnh">
              <span id="imageHelp" class="small text-secondary">
                Chọn ảnh từ máy.
              </span>
            </div>

            <label class="form-label" for="desc">Mô tả</label>
            <textarea id="desc" class="form-control mb-3" rows="2"
              maxlength="2000"></textarea>

            <button class="btn btn-dark w-100" id="save">LƯU SẢN PHẨM</button>
            <button class="btn btn-outline-secondary w-100 mt-2"
              type="button" id="reset">Làm mới</button>
          </form>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card p-3">
          <h2 class="h5">Danh sách sản phẩm</h2>
          <div class="row g-2 mb-3" aria-label="Lọc sản phẩm">
            <div class="col-12">
              <label class="visually-hidden" for="productSearch">Tìm theo tên sản phẩm</label>
              <input id="productSearch" class="form-control" type="search" placeholder="Tìm theo tên sản phẩm…" autocomplete="off">
            </div>
            <div class="col-sm-6">
              <label class="visually-hidden" for="productCategoryFilter">Lọc theo danh mục</label>
              <select id="productCategoryFilter" class="form-select"><option value="">Tất cả danh mục</option></select>
            </div>
            <div class="col-sm-6">
              <label class="visually-hidden" for="productAudienceFilter">Lọc theo nhóm khách hàng</label>
              <select id="productAudienceFilter" class="form-select"><option value="">Tất cả nhóm khách hàng</option></select>
            </div>
            <div class="col-12 d-flex flex-wrap justify-content-between align-items-center gap-2">
              <span id="productCountSummary" class="small text-secondary" aria-live="polite"></span>
              <nav class="d-flex align-items-center gap-2" aria-label="Phân trang sản phẩm">
                <button id="productsPrev" class="btn btn-outline-dark btn-sm" type="button">Trước</button>
                <span id="productsPageLabel" class="small text-nowrap"></span>
                <button id="productsNext" class="btn btn-outline-dark btn-sm" type="button">Tiếp</button>
              </nav>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Ảnh</th>
                  <th>Sản phẩm</th>
                  <th>Giá / tồn</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-12">
        <div class="card p-3">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
            <h2 class="h5 mb-0">Đơn hàng COD</h2>
            <button id="refreshOrders" type="button" class="btn btn-outline-dark btn-sm">Tải lại đơn hàng</button>
          </div>
          <div class="table-responsive"><table class="table table-sm align-middle">
            <thead><tr><th>Mã đơn</th><th>Khách nhận</th><th>Sản phẩm</th><th>Tổng</th><th>Trạng thái</th><th>Cập nhật</th></tr></thead>
            <tbody id="orderRows"><tr><td colspan="6" class="text-secondary">Đăng nhập để tải đơn hàng.</td></tr></tbody>
          </table></div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
const API_URL = 'https://fashion-store-in8c.onrender.com';
const ADMIN_TOKEN_KEY = 'dkFashionAdminToken';

let token = localStorage.getItem(ADMIN_TOKEN_KEY) || '';
let image = '';
let allProducts = [];
let currentProductPage = 1;
let productTotal = 0;
let productCatalogTotal = 0;
let productPageCount = 0;
let productFilters = { categories: [], audiences: [] };
let productSearchTimer;
const productImageUrls = new Set();
const ADMIN_PAGE_SIZE = 20;
const productImageObserver = 'IntersectionObserver' in window
  ? new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      productImageObserver.unobserve(entry.target);
      void loadProductThumbnail(entry.target, entry.target.dataset.productId);
    }
  })
  : null;

const $ = id => document.getElementById(id);

function msg(t, type = 'info') {
  $('notice').textContent = t;
  $('notice').className = 'alert alert-' + type;
  window.scrollTo(0, 0);
}

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };

  if (token) {
    headers.Authorization = 'Bearer ' + token;
  }

  if (opts.body) {
    headers['Content-Type'] = 'application/json';
  }

  const r = await fetch(API_URL + path, {
    ...opts,
    headers
  });

  if (r.status === 204) {
    return null;
  }

  const d = await r.json().catch(() => ({}));

  if (!r.ok) {
    throw Error(d.message || 'Không kết nối được máy chủ');
  }

  return d;
}

async function fetchProductImage(id) {
  const response = await fetch(
    API_URL + '/api/v1/admin/products/' + encodeURIComponent(id) + '/image',
    {
      cache: 'no-store',
      headers: { Authorization: 'Bearer ' + token }
    }
  );
  if (!response.ok) {
    throw Error('Không tải được ảnh sản phẩm.');
  }
  return response.blob();
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || Error('Không đọc được ảnh sản phẩm.'));
    reader.readAsDataURL(blob);
  });
}

async function loadProductThumbnail(img, id) {
  try {
    const blob = await fetchProductImage(id);
    const url = URL.createObjectURL(blob);
    if (img.isConnected) {
      productImageUrls.add(url);
      img.src = url;
    } else {
      URL.revokeObjectURL(url);
    }
  } catch {
    if (img.isConnected) img.alt = 'Không tải được ảnh sản phẩm';
  }
}

$('loginForm').onsubmit = async e => {
  e.preventDefault();

  try {
    token = (
      await api('/api/v1/admin/login', {
        method: 'POST',
        body: JSON.stringify({
          username: $('username').value.trim(),
          password: $('pw').value
        })
      })
    ).token;
    localStorage.setItem(ADMIN_TOKEN_KEY, token);

    $('pw').value = '';
    $('login').classList.add('d-none');
    $('panel').classList.remove('d-none');

    msg('Đăng nhập thành công', 'success');

    await load();
    await loadOrders();
  } catch (e) {
    msg(e.message, 'danger');
  }
};

$('logout').onclick = () => {
  token = '';
  localStorage.removeItem(ADMIN_TOKEN_KEY);
  $('panel').classList.add('d-none');
  $('login').classList.remove('d-none');
};

async function acceptAdminToken(candidate) {
  token = candidate;
  localStorage.setItem(ADMIN_TOKEN_KEY, token);
  $('login').classList.add('d-none');
  $('panel').classList.remove('d-none');
  try {
    await load();
    await loadOrders();
    msg('Đăng nhập thành công', 'success');
  } catch (error) {
    token = '';
    localStorage.removeItem(ADMIN_TOKEN_KEY);
    $('panel').classList.add('d-none');
    $('login').classList.remove('d-none');
    msg(error.message, 'danger');
  }
}

const fragment = new URLSearchParams(location.hash.slice(1));
const fragmentToken = fragment.get('adminToken');
if (fragmentToken) {
  history.replaceState(null, '', location.pathname + location.search);
  void acceptAdminToken(fragmentToken);
} else if (token) {
  void acceptAdminToken(token);
}

$('file').onchange = async () => {
  const f = $('file').files[0];

  if (!f) return;

  if (
    !['image/jpeg', 'image/png', 'image/webp'].includes(f.type) ||
    f.size > 450 * 1024
  ) {
    msg('Chỉ JPEG/PNG/WEBP tối đa 450 KB', 'danger');
    $('file').value = '';
    return;
  }

  image = await new Promise((ok, no) => {
    const r = new FileReader();

    r.onload = () => ok(r.result);
    r.onerror = no;
    r.readAsDataURL(f);
  });

  $('preview').src = image;
  $('imageHelp').textContent = f.name;
};

function sizes() {
  const o = {};

  for (const pair of $('sizes').value.split(',')) {
    const [s, n, ...extra] = pair.trim().split(':');
    const q = Number(n);

    if (
      !s ||
      n === undefined ||
      extra.length ||
      !Number.isInteger(q) ||
      q < 0
    ) {
      throw Error('Kích cỡ sai. Ví dụ: 36:2, 37:4');
    }

    if (Object.hasOwn(o, s)) {
      throw Error('Kích cỡ bị lặp: ' + s);
    }

    o[s] = q;
  }

  if (!Object.keys(o).length) {
    throw Error('Nhập ít nhất một kích cỡ');
  }

  return o;
}

function inferProductSubcategory(name) {
  const text = String(name || '').normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd')
    .toLocaleLowerCase('vi');
  if (/\b(giay|shoe|sneaker|boot)\b/.test(text)) return 'Giày';
  if (/\b(dep|sandal|flip flop)\b/.test(text)) return 'Dép';
  if (/\b(quan|pants|trouser|jeans)\b/.test(text)) return 'Quần';
  if (/\b(ao|shirt|top|hoodie|jacket)\b/.test(text)) return 'Áo';
  if (/\b(phu kien|tui|bag|cap|hat|socks|accessor)\b/.test(text)) return 'Phụ kiện';
  return '';
}

function productClassification(mainCategory, subcategory) {
  const allowedMainCategories = ['Nam', 'Nữ', 'Trẻ em', 'sports'];
  const allowedSubcategories = ['Giày', 'Dép', 'Quần', 'Áo', 'Phụ kiện'];
  if (
    !allowedMainCategories.includes(mainCategory) ||
    !allowedSubcategories.includes(subcategory)
  ) {
    throw Error('Chọn danh mục chính và danh mục con hợp lệ.');
  }

  return {
    category: mainCategory === 'sports' ? 'Thể thao - ' + subcategory : subcategory,
    audience: mainCategory === 'sports' ? 'Thể thao' : mainCategory
  };
}

$('form').onsubmit = async e => {
  e.preventDefault();

  try {
    if (!image) {
      throw Error('Chọn ảnh sản phẩm');
    }

    const classification = productClassification(
      $('productMainCategory').value,
      $('category').value
    );
    const p = {
      name: $('name').value.trim(),
      price: Number($('price').value),
      ...classification,
      description: $('desc').value.trim(),
      image,
      sizes: sizes()
    };

    const id = $('id').value;

    const wasEditing = Boolean(id);
    const endpoint = wasEditing
      ? '/api/v1/admin/products/' + encodeURIComponent(id)
      : '/api/v1/admin/products';
    await api(endpoint, {
      method: wasEditing ? 'PUT' : 'POST',
      body: JSON.stringify(p)
    });

    reset();
    try {
      await load();
      msg(wasEditing ? 'Đã cập nhật sản phẩm' : 'Đã thêm sản phẩm', 'success');
    } catch (refreshError) {
      msg(
        wasEditing
          ? `Sản phẩm đã cập nhật nhưng danh sách chưa tải lại được: ${refreshError.message}`
          : `Sản phẩm đã thêm nhưng danh sách chưa tải lại được: ${refreshError.message}`,
        'warning'
      );
    }
  } catch (e) {
    msg(e.message, 'danger');
  }
};

function reset() {
  const productForm = $('form');
  HTMLFormElement.prototype.reset.call(productForm);
  $('id').value = '';
  image = '';

  $('preview').removeAttribute('src');
  $('imageHelp').textContent = 'Chọn ảnh từ máy.';
  $('legacyCategoryNotice').hidden = true;
  $('legacyCategoryNotice').textContent = '';
  $('formTitle').textContent = 'Thêm sản phẩm';
  $('save').textContent = 'LƯU SẢN PHẨM';
}

$('reset').onclick = reset;

function price(n) {
  return Number(n).toLocaleString('vi-VN') + ' đ';
}

async function load() {
  const params = new URLSearchParams({
    page: String(currentProductPage),
    limit: String(ADMIN_PAGE_SIZE),
    q: $('productSearch').value.trim(),
    category: $('productCategoryFilter').value,
    audience: $('productAudienceFilter').value
  });
  const d = await api('/api/v1/admin/products?' + params);
  allProducts = Array.isArray(d.products) ? d.products : [];
  productTotal = Number(d.pagination?.total || 0);
  productCatalogTotal = Number(d.pagination?.totalProducts || productTotal);
  productPageCount = Number(d.pagination?.totalPages || 0);
  productFilters = d.filters || productFilters;
  if (productPageCount && currentProductPage > productPageCount) {
    currentProductPage = productPageCount;
    return load();
  }
  populateProductFilters();
  renderProducts();
}

function populateProductFilters() {
  for (const [id, field, emptyLabel] of [
    ['productCategoryFilter', 'category', 'Tất cả danh mục'],
    ['productAudienceFilter', 'audience', 'Tất cả nhóm khách hàng']
  ]) {
    const select = $(id);
    const previousValue = select.value;
    const values = id === 'productCategoryFilter'
      ? productFilters.categories
      : productFilters.audiences;
    select.replaceChildren(new Option(emptyLabel, ''));
    values.forEach(value => select.add(new Option(value, value)));
    if (values.includes(previousValue)) select.value = previousValue;
  }
}

function filteredProducts() {
  return allProducts;
}

function renderProducts() {
  const rows = $('rows');
  if (productImageObserver) {
    rows.querySelectorAll('img[data-product-id]').forEach(img => productImageObserver.unobserve(img));
  }
  rows.replaceChildren();
  for (const url of productImageUrls) URL.revokeObjectURL(url);
  productImageUrls.clear();
  const products = filteredProducts();
  const pageCount = Math.max(1, productPageCount);
  const visibleProducts = products;
  $('productCountSummary').textContent = `${productTotal} sản phẩm · ${productCatalogTotal} tổng cộng`;
  $('productsPageLabel').textContent = `Trang ${currentProductPage} / ${pageCount}`;
  $('productsPrev').disabled = currentProductPage <= 1;
  $('productsNext').disabled = currentProductPage >= pageCount;

  if (!visibleProducts.length) {
    const row = document.createElement('tr');
    const cell = document.createElement('td');
    cell.colSpan = 4;
    cell.className = 'text-center text-secondary py-4';
    cell.textContent = 'Không tìm thấy sản phẩm phù hợp.';
    row.append(cell);
    rows.append(row);
    return;
  }

  for (const p of visibleProducts) {
    const tr = document.createElement('tr');
    const im = document.createElement('img');

    im.alt = 'Ảnh ' + p.name;
    im.className = 'thumb';
    im.loading = 'lazy';
    im.dataset.productId = p.id;
    if (productImageObserver) productImageObserver.observe(im);
    else void loadProductThumbnail(im, p.id);

    const td0 = document.createElement('td');
    td0.append(im);

    const td1 = document.createElement('td');
    const b = document.createElement('b');
    const small = document.createElement('div');

    b.textContent = p.name;
    small.className = 'small text-secondary';
    small.textContent = p.category + ' · ' + p.audience + (p.active ? ' · Đang bán' : ' · Đã lưu trữ');

    td1.append(b, small);

    const td2 = document.createElement('td');
    td2.textContent = price(p.price) + ' · tồn ' + p.stock;

    const td3 = document.createElement('td');
    const edit = document.createElement('button');
    const del = document.createElement('button');

    edit.className = 'btn btn-sm btn-outline-dark mb-1';
    edit.textContent = 'Sửa';

    edit.onclick = async () => {
      $('id').value = p.id;
      $('name').value = p.name;
      $('price').value = p.price;
      const savedCategory = String(p.category || '');
      const sportCategory = /^thể thao\s*-\s*/i.test(savedCategory);
      const sportsAudience = /^(thể thao|sports)$/i.test(String(p.audience || '').trim());
      const legacyCategory = /^(chạy bộ|lifestyle|giá tốt|training|originals)$/i.test(savedCategory);
      const isSportsProduct = sportCategory || sportsAudience || legacyCategory;
      const savedSubcategory = sportCategory
        ? savedCategory.replace(/^thể thao\s*-\s*/i, '').trim()
        : legacyCategory ? inferProductSubcategory(p.name) : savedCategory;
      const mappedSubcategory = legacyCategory
        ? inferProductSubcategory(p.name)
        : savedSubcategory;
      const mainCategory = isSportsProduct ? 'sports' : String(p.audience || '');
      const hasMainCategory = [...$('productMainCategory').options]
        .some(option => option.value === mainCategory);
      $('productMainCategory').value = hasMainCategory ? mainCategory : '';
      const hasSubcategory = [...$('category').options]
        .some(option => option.value === mappedSubcategory);
      $('category').value = hasSubcategory ? mappedSubcategory : '';
      const notice = $('legacyCategoryNotice');
      if (legacyCategory) {
        notice.hidden = false;
        notice.textContent = `Sản phẩm đang thuộc danh mục cũ “${savedCategory}”. Hệ thống gợi ý “Thể thao - ${mappedSubcategory || 'chưa xác định'}” từ tên sản phẩm; hãy kiểm tra danh mục con trước khi lưu. Dữ liệu chỉ đổi khi bạn chủ động lưu.`;
      } else if (!hasMainCategory || !hasSubcategory) {
        notice.hidden = false;
        notice.textContent = `Danh mục hiện tại “${savedCategory}” hoặc nhóm chính “${p.audience || ''}” không thuộc các lựa chọn hiện tại. Chọn danh mục chính và danh mục con phù hợp trước khi lưu; dữ liệu chưa bị thay đổi.`;
      } else {
        notice.hidden = true;
        notice.textContent = '';
      }
      $('desc').value = p.description || '';

      $('sizes').value = Object.entries(p.sizes || {})
        .map(([k, v]) => k + ':' + v)
        .join(', ');

      $('formTitle').textContent = 'Sửa sản phẩm';
      $('save').textContent = 'CẬP NHẬT';
      window.scrollTo(0, 0);
      image = '';
      $('preview').removeAttribute('src');
      $('save').disabled = true;
      $('reset').disabled = true;
      document.querySelectorAll('#rows button').forEach(button => { button.disabled = true; });
      $('imageHelp').textContent = 'Đang tải ảnh hiện tại…';
      try {
        const blob = await fetchProductImage(p.id);
        const currentImage = await blobToDataUrl(blob);
        if ($('id').value !== String(p.id)) return;
        image = currentImage;
        $('preview').src = currentImage;
        $('imageHelp').textContent = 'Đang dùng ảnh hiện tại';
      } catch (error) {
        if ($('id').value === String(p.id)) msg(error.message, 'danger');
      } finally {
        $('save').disabled = false;
        $('reset').disabled = false;
        document.querySelectorAll('#rows button').forEach(button => { button.disabled = false; });
      }
    };

    del.className = 'btn btn-sm ' + (p.active ? 'btn-outline-danger' : 'btn-outline-success');
    del.textContent = p.active ? 'Ẩn khỏi cửa hàng' : 'Khôi phục';

    del.onclick = async () => {
      const restoring = !p.active;
      if (confirm(restoring ? 'Khôi phục sản phẩm này lên cửa hàng?' : 'Ẩn sản phẩm này khỏi cửa hàng?')) {
        try {
          await api(restoring
            ? '/api/v1/admin/products/' + p.id + '/restore'
            : '/api/v1/admin/products/' + p.id, {
            method: restoring ? 'PATCH' : 'DELETE'
          });

          await load();
          msg(restoring ? 'Đã khôi phục sản phẩm' : 'Đã ẩn sản phẩm', 'success');
        } catch (e) {
          msg(e.message, 'danger');
        }
      }
    };

    td3.append(edit, document.createElement('br'), del);
    tr.append(td0, td1, td2, td3);
    rows.append(tr);
  }
}

$('productSearch').addEventListener('input', () => {
  currentProductPage = 1;
  window.clearTimeout(productSearchTimer);
  productSearchTimer = window.setTimeout(() => {
    load().catch(error => msg(error.message, 'danger'));
  }, 250);
});
$('productCategoryFilter').addEventListener('change', () => {
  currentProductPage = 1;
  load().catch(error => msg(error.message, 'danger'));
});
$('productAudienceFilter').addEventListener('change', () => {
  currentProductPage = 1;
  load().catch(error => msg(error.message, 'danger'));
});
$('productsPrev').onclick = () => {
  currentProductPage -= 1;
  load().catch(error => msg(error.message, 'danger'));
};
$('productsNext').onclick = () => {
  currentProductPage += 1;
  load().catch(error => msg(error.message, 'danger'));
};

async function loadOrders() {
  const body = $('orderRows');
  body.replaceChildren();
  try {
    const data = await api('/api/v1/admin/orders');
    if (!data.orders?.length) {
      const tr = document.createElement('tr'); const td = document.createElement('td');
      td.colSpan = 6; td.className = 'text-secondary'; td.textContent = 'Chưa có đơn hàng COD.'; tr.append(td); body.append(tr); return;
    }
    for (const order of data.orders) {
      const tr = document.createElement('tr');
      const values = [
        `DK-${order.id}`,
        `${order.customer_name} · ${order.customer_phone}\n${order.customer_address}`,
        (order.items || []).map(i => `${i.name} (${i.size}) ×${i.quantity}`).join(', '),
        price(order.total_vnd)
      ];
      values.forEach((value, index) => { const td = document.createElement('td'); td.textContent = value; if(index===1||index===2) td.style.whiteSpace='pre-line'; tr.append(td); });
      const statusCell = document.createElement('td');
      const select = document.createElement('select'); select.className = 'form-select form-select-sm';
      [['pending','Chờ xác nhận'],['confirmed','Đã xác nhận'],['shipping','Đang giao'],['completed','Hoàn thành'],['cancelled','Đã hủy']].forEach(([v,label])=>{const option=document.createElement('option');option.value=v;option.textContent=label;option.selected=order.status===v;select.append(option);});
      statusCell.append(select); tr.append(statusCell);
      const actionCell=document.createElement('td'); const save=document.createElement('button'); save.className='btn btn-sm btn-dark';save.textContent='Lưu';
      save.onclick=async()=>{save.disabled=true;try{await api(`/api/v1/admin/orders/${order.id}/status`,{method:'PATCH',body:JSON.stringify({status:select.value})});msg('Đã cập nhật trạng thái đơn hàng','success');await loadOrders();}catch(e){msg(e.message,'danger');}finally{save.disabled=false;}};
      actionCell.append(save);tr.append(actionCell);body.append(tr);
    }
  } catch (e) {
    const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.className='text-danger';td.textContent=e.message;tr.append(td);body.append(tr);
  }
}
$('refreshOrders').onclick = loadOrders;

</script>
</body>
