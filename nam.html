<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Mục Đồ Nam - DK FASHION</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,700;0,900;1,900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --adidas-black: #000000;
            --adidas-white: #ffffff;
            --adidas-gray: #767677;
            --adidas-light-gray: #f5f5f5;
            --adidas-red: #d13b3b;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--adidas-black);
            background-color: var(--adidas-white);
            overflow-x: hidden;
        }

        /* Top Utility Bar */
        .top-bar {
            background-color: var(--adidas-black);
            color: var(--adidas-white);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 6px 0;
        }
        .top-bar a {
            color: var(--adidas-white);
            text-decoration: none;
            margin-left: 15px;
        }

        /* Main Navbar */
        .main-nav {
            border-bottom: 1px solid #e9ecef;
            padding: 10px 0;
            background: #fff;
        }

        .brand-logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #000;
        }
        .logo-stripes {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 24px;
        }
        .stripe {
            background-color: #000;
            width: 6px;
            transform: skewX(-20deg);
        }
        .stripe-1 { height: 12px; }
        .stripe-2 { height: 18px; }
        .stripe-3 { height: 24px; }

        .brand-text {
            font-weight: 900;
            font-size: 20px;
            letter-spacing: -1px;
            font-style: italic;
            line-height: 1;
        }

        .nav-categories .nav-link {
            color: #000;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            padding: 8px 14px !important;
            text-transform: uppercase;
        }
        .nav-categories .nav-link.active {
            border-bottom: 2px solid #000;
        }

        /* Mobile Drawer Menu (Offcanvas) */
        .offcanvas-header {
            border-bottom: 1px solid #eee;
        }
        .mobile-menu-link {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            color: #000;
            text-decoration: none;
            padding: 12px 0;
            display: block;
            border-bottom: 1px solid #f5f5f5;
        }

        /* Filter Bar & Tags */
        .filter-bar-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .filter-tags-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .filter-tags-scroll::-webkit-scrollbar { display: none; }
        
        .filter-tag-pill {
            background-color: #f0f0f0;
            color: #000;
            border: 1px solid transparent;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 0;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .filter-tag-pill:hover, .filter-tag-pill.active {
            background-color: #000;
            color: #fff;
        }

        /* Product Card Styling (Tối ưu Mobile 2 Cột) */
        .adidas-card {
            border: none;
            border-radius: 0;
            background: transparent;
            position: relative;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .img-wrapper {
            background-color: var(--adidas-light-gray);
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .adidas-card:hover .img-wrapper img {
            transform: scale(1.04);
        }
        .wishlist-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: transparent;
            border: none;
            font-size: 16px;
            cursor: pointer;
            z-index: 2;
            color: #000;
        }
        .badge-discount {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: #fff;
            color: var(--adidas-red);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 5px;
        }

        .card-info {
            padding-top: 8px;
        }
        .product-price-box {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 2px;
        }
        .current-price {
            font-size: 13px;
            font-weight: 700;
            color: var(--adidas-red);
        }
        .original-price {
            font-size: 11px;
            font-weight: 500;
            color: var(--adidas-gray);
            text-decoration: line-through;
        }
        .product-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 2px;
            color: #000;
            text-decoration: none;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.25;
        }
        .product-category {
            font-size: 11px;
            color: var(--adidas-gray);
            font-weight: 500;
        }

        /* Toast thông báo */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1080;
        }

        /* MEDIA QUERY TỐI ƯU RIÊNG CHO MOBILE (Dưới 768px) */
        @media (max-width: 768px) {
            .top-bar {
                display: none !important; /* Ẩn thanh menu phụ trên mobile */
            }
            .main-nav {
                padding: 8px 0;
            }
            .brand-text {
                font-size: 18px;
            }
            /* Lưới sản phẩm ép thành 2 cột sóng đôi */
            #productGridNam > .col {
                flex: 0 0 50% !important;
                max-width: 50% !important;
                padding-left: 6px !important;
                padding-right: 6px !important;
            }
            #productGridNam {
                margin-left: -6px;
                margin-right: -6px;
            }
            .container-fluid {
                padding-left: 12px !important;
                padding-right: 12px !important;
            }
        }
    </style>
</head>
<body>

    <!-- Top Utility Bar (Desktop) -->
    <div class="top-bar">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <div>
                <a href="admin.html" target="_blank" class="text-warning text-decoration-none fw-bold ms-0"><i class="fa-solid fa-lock me-1"></i> QUẢN TRỊ ADMIN</a>

            <div>
                <a href="#">TÌM CỬA HÀNG</a>

                <span class="ms-3"><i class="fa-solid fa-flag text-danger"></i> VN</span>

        </div>

    <!-- Main Navigation Bar -->
    <nav class="main-nav sticky-top">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            
            <!-- Hamburger Menu Button cho Mobile -->
            <button class="btn d-md-none border-0 p-0 me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileDrawer">
                <i class="fa-solid fa-bars fs-4"></i>
            </button>

            <!-- Brand Logo -->
            <a href="index.html" class="brand-logo-container">
                <div class="logo-stripes">
                    <div class="stripe stripe-1"></div>
                    <div class="stripe stripe-2"></div>
                    <div class="stripe stripe-3"></div>
                </div>
                <span class="brand-text">DK FASHION</span>
            </a>

            <!-- Desktop Menu Links -->
            <ul class="nav nav-categories d-none d-md-flex">
                <li class="nav-item"><a class="nav-link active" href="nam.html">NAM</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html">NỮ</a></li>
                <li class="nav-item"><a class="nav-link" href="#">TRẺ EM</a></li>
                <li class="nav-item"><a class="nav-link" href="#">THỂ THAO</a></li>

                <div class="position-relative fs-5 ms-1 cursor-pointer" title="Giỏ hàng">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 9px;">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Mobile Drawer Offcanvas Menu -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileDrawer">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title fw-bold fst-italic">DK FASHION MENU</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <a href="nam.html" class="mobile-menu-link text-danger">NAM</a>
            <a href="index.html" class="mobile-menu-link">NỮ</a>
            <a href="#" class="mobile-menu-link">TRẺ EM</a>
            <a href="#" class="mobile-menu-link">THỂ THAO</a>
            <a href="#" class="mobile-menu-link">BỘ SỰ TẬP</a>
            <div class="mt-4 pt-3 border-top">
                <a href="admin.html" target="_blank" class="btn btn-dark w-100 rounded-0 fw-bold mb-2"><i class="fa-solid fa-lock me-1"></i> Trang Quản Trị (Admin)</a>
                <a href="index.html" class="btn btn-outline-dark w-100 rounded-0 fw-bold"><i class="fa-solid fa-house me-1"></i> Về Trang Chủ</a>
            </div>
        </div>
    </div>

    <!-- Main Content Container -->
    <main class="container-fluid px-4 mt-3">
        
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb" style="font-size: 11px; font-weight: 600; margin-bottom: 8px;">
                <li class="breadcrumb-item"><a href="index.html" class="text-dark text-decoration-none">Trang Chủ</a></li>
                <li class="breadcrumb-item active" aria-current="page">Nam</li>
            </ol>
        </nav>

        <!-- Filter Bar & Tags -->
        <div class="filter-bar-container">
            <div class="filter-tags-scroll">
                <a href="#" class="filter-tag-pill active">World Cup 26™</a>
                <a href="#" class="filter-tag-pill">Collection ✨</a>
                <a href="#" class="filter-tag-pill">Court sports</a>
                <a href="#" class="filter-tag-pill">Mới Về ✨</a>
            </div>
            <a href="admin.html" target="_blank" class="text-dark fw-bold text-decoration-underline small d-none d-sm-inline-block"><i class="fa-solid fa-gear me-1"></i> Quản lý</a>
        </div>

        <!-- Product Grid Container (2 cột trên Mobile, 5 cột trên Desktop) -->
        <div class="row row-cols-2 row-cols-sm-2 row-cols-md-3 row-cols-lg-5 g-2 g-md-3" id="productGridNam">
            <!-- Dữ liệu render tự động từ localStorage -->
        </div>
    </main>

    <!-- Modal Chi Tiết Sản Phẩm & Thêm vào giỏ (Responsive Fullscreen trên Mobile) -->
    <div class="modal fade" id="productDetailModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-fullscreen-sm-down">
            <div class="modal-content rounded-0 border-0">

                    <div class="row">

                            </div>
                        </div>
                        <div class="col-md-5">
                            <span id="modalCategory" class="text-muted small fw-bold"></span>
                            <h2 id="modalTitle" class="fw-black fs-5 fs-md-4 mt-1 mb-2"></h2>
                            <p id="modalDesc" class="small text-muted mb-3"></p>
                            
                            <div class="mb-3">
                                <span id="modalPrice" class="fs-4 fw-bold text-danger"></span>
                                <span id="modalOriginalPrice" class="text-muted text-decoration-line-through ms-2 small"></span>
                            </div>

                            <div class="mb-3">
                                <label class="fw-bold small mb-2">CHỌN KÍCH CỠ:</label>
                                <div class="d-flex gap-2" id="sizeSelector">

                                    <button type="button" class="btn btn-outline-dark rounded-0 btn-sm px-3 size-btn" onclick="selectSize(this)">L</button>
                                    <button type="button" class="btn btn-outline-dark rounded-0 btn-sm px-3 size-btn" onclick="selectSize(
